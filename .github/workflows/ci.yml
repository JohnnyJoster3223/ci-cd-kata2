name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        run: npm init @eslint/config@latest

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          path: 'dist/'
